<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <circle cx="180" cy="80" r="220" fill="url(#glowA)"/>
  <circle cx="1040" cy="300" r="260" fill="url(#glowB)"/>
  <circle cx="600" cy="180" r="300" fill="none" stroke="#3b82f6" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="600" cy="180" r="220" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>

  <line x1="80" y1="72" x2="1120" y2="72" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="1"/>

  <polyline points="120,120 200,120 240,160 320,160" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1.5"/>
  <polyline points="880,240 960,240 1000,200 1080,200" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="3" fill="#60a5fa" fill-opacity="0.35"/>
  <circle cx="1080" cy="200" r="3" fill="#22d3ee" fill-opacity="0.35"/>

  <rect x="80" y="150" width="1040" height="1" fill="url(#accentLine)" opacity="0.6"/>

  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64.0" font-weight="700" fill="#ffffff">IDM Patcher</text>

  <text x="600" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Read-only inspector for IDM Patcher setups — shows what a patch</tspan>
    <tspan x="600" dy="28">touches before you run it.</tspan>
  </text>

  <circle cx="600" cy="286" r="4" fill="#60a5fa" fill-opacity="0.55"/>
  <circle cx="600" cy="286" r="10" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
</svg>